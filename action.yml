name: "Docstring Check"
description: "Checks docstring/code consistency on changes"

inputs:
  project-path:
    description: "Path to the project to check"
    required: false
    default: "."
  fail-on-warning:
    description: "Fail the check when at least one warning is emitted. true/false forces a value; empty uses the default."
    required: false
  include-visibility:
    description: "Visibilities to check, comma-separated"
    required: false
  profile:
    description: "Built-in severity profile; empty uses the pyproject.toml configuration"
    required: false
  base-ref:
    description: "Reference branch used to calculate the diff (for example, main)"
    required: false
  on-missing-base:
    description: "Behavior when a changed file's base Git snapshot is unavailable after diff resolution: emit_all or fail. Empty uses the default."
    required: false
  on-nonlinear-push-without-base:
    description: "Behavior for a non-linear push without a configured base-ref: fail, head_commit, or warn. Empty uses the default."
    required: false
  check-mode:
    description: "Check mode: regression or catchup. Empty uses the default (regression)."
    required: false
  annotation-placement:
    description: "Annotation placement: signature, docstring, or precise. Empty uses the default (signature)."
    required: false
  exclude-paths:
    description: "Project-relative files or directories to exclude from Check and DIA, comma-separated. Empty uses pyproject.toml."
    required: false
  dia-exclude-paths:
    description: "Project-relative files or directories to exclude from DIA only, comma-separated. Empty uses pyproject.toml."
    required: false

runs:
  using: "docker"
  image: "Dockerfile"
  args:
    - "--project-path"
    - "${{ inputs.project-path }}"
    - "--fail-on-warning"
    - "${{ inputs.fail-on-warning }}"
    - "--include-visibility"
    - "${{ inputs.include-visibility }}"
    - "--profile"
    - "${{ inputs.profile }}"
    - "--base-ref"
    - "${{ inputs.base-ref }}"
    - "--on-missing-base"
    - "${{ inputs.on-missing-base }}"
    - "--on-nonlinear-push-without-base"
    - "${{ inputs.on-nonlinear-push-without-base }}"
    - "--check-mode"
    - "${{ inputs.check-mode }}"
    - "--annotation-placement"
    - "${{ inputs.annotation-placement }}"
    - "--exclude-paths"
    - "${{ inputs.exclude-paths }}"
    - "--dia-exclude-paths"
    - "${{ inputs.dia-exclude-paths }}"

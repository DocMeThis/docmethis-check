workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - when: never

stages:
  - documentation

variables:
  # Replace this placeholder with the digest emitted by publish-docker.yml.
  DOCMETHIS_CHECK_IMAGE: "ghcr.io/docmethis/docmethis-check@sha256:<release-digest>"
  GIT_DEPTH: "0"

docmethis_check:
  image:
    name: "$DOCMETHIS_CHECK_IMAGE"
    entrypoint: [""]

  stage: documentation

  before_script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"

  script:
    - >
      python -m docmethis_check
      --gitlab-output-file gl-code-quality-report.json
      --json-output-file docmethis-report.json

  artifacts:
    when: always
    reports:
      codequality: gl-code-quality-report.json
    paths:
      - docmethis-report.json

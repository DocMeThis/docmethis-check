name: DocMeThis Fix

on:
  pull_request:
    types: [opened, reopened, synchronize]

env:
  DOCMETHIS_FIX_VERSION: "0.1.0"

concurrency:
  group: docmethis-fix-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fix:
    name: DocMeThis Fix runtime
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]' &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout consumer repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.head_ref }}
          token: ${{ github.token }}

      - name: Prepare the source branch upstream
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
        run: git branch --set-upstream-to="origin/${PR_HEAD_REF}" "${PR_HEAD_REF}"

      - name: Install private Fix runtime
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/docmethis-fix-venv"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install --upgrade pip
          "$venv/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            --index-url https://pkg.docmethis.com \
            --extra-index-url https://pypi.org/simple \
            --only-binary=:all: \
            "docmethis-fix==${DOCMETHIS_FIX_VERSION}"
          echo "FIX_PYTHON=$venv/bin/python" >> "$GITHUB_ENV"

      - name: Prepare Gateway key
        env:
          FIX_API_KEY: ${{ secrets.DOCMETHIS_FIX_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$FIX_API_KEY"
          key_file="$RUNNER_TEMP/docmethis-fix-api-key"
          umask 077
          printf '%s' "$FIX_API_KEY" > "$key_file"
          echo "DOCMETHIS_FIX_API_KEY_FILE=$key_file" >> "$GITHUB_ENV"

      - name: Generate the Check hand-off
        id: check
        env:
          GITHUB_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set +e
          "$FIX_PYTHON" -m docmethis_check . \
            --check-mode regression \
            --no-cache \
            --json-output-file rapport.json \
            --on-nonlinear-push-without-base fail
          status=$?
          set -e
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi
          test -s rapport.json

      - name: Apply eligible Fix corrections
        if: >-
          steps.check.outputs.status == '0' || steps.check.outputs.status == '1'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # F18 : type du compte propriétaire du dépôt de base de la PR, recoupé
          # par Fix avec GITHUB_EVENT_PATH.
          DOCMETHIS_FIX_ACCOUNT_TYPE: ${{ github.event.pull_request.base.repo.owner.type }}
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          set +e
          "$FIX_PYTHON" -m docmethis_fix rapport.json \
            --project-root . \
            --push \
            > fix-result.json 2> fix-error.txt
          status=$?
          set -e

          if [ -s fix-result.json ]; then
            cat fix-result.json
          fi
          if [ -s fix-error.txt ]; then
            cat fix-error.txt >&2
          fi
          exit "$status"

      - name: Prepare the review patch
        if: always()
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          {
            git diff --binary "$PR_HEAD_SHA" HEAD
            git diff --binary
            git diff --cached --binary
          } > fix.patch
          true

      - name: Publish Fix results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: docmethis-fix-results
          path: |
            rapport.json
            fix-result.json
            fix.patch
            .docmethis/inference-diagnostics.jsonl
          if-no-files-found: ignore

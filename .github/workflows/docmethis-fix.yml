name: DocMeThis Fix

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  fix:
    # Référence officielle figée par SHA complet : toute étape privilégiée vit
    # dans le workflow officiel `fix.yml`, approuvé côté Gateway.
    # TODO(F20) : remplacer ce SHA par celui approuvé après publication du
    # workflow renommé.
    uses: DocMeThis/docmethis-fix/.github/workflows/fix.yml@e81a8700ac07fd890319978564abddaafc3ffc2b
    permissions:
      contents: read
      id-token: write
    secrets:
      DOCMETHIS_FIX_API_KEY: ${{ secrets.DOCMETHIS_FIX_API_KEY }}
      LLM_API_KEY: ${{ secrets.OPENCODE_API_KEY }}

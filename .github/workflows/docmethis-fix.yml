name: DocMeThis Fix

on:
  workflow_dispatch:

# Skeleton only. This workflow must be connected to the authenticated private
# runtime distribution before enabling it for consumer pushes.
permissions:
  contents: write

jobs:
  fix:
    name: Run private DocMeThis Fix runtime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout consumer repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install private Fix runtime
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/docmethis-fix-venv"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install --upgrade pip
          "$venv/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            --index-url https://pkg.docmethis.com \
            --extra-index-url https://pypi.org/simple \
            --only-binary=:all: \
            docmethis-fix==0.1.0
          echo "FIX_PYTHON=$venv/bin/python" >> "$GITHUB_ENV"

      - name: Run Check and private Fix
        run: |
          printf '%s\n' 'Reserved for the exact private runtime contract.'
          exit 1

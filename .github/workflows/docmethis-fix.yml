name: DocMeThis Fix

on:
  workflow_dispatch:

env:
  DOCMETHIS_FIX_VERSION: "0.1.0"

permissions:
  contents: write
  pull-requests: write

jobs:
  fix:
    name: Run private DocMeThis Fix runtime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout consumer repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install private Fix runtime
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/docmethis-fix-venv"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install --upgrade pip
          "$venv/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            --index-url https://pkg.docmethis.com \
            --extra-index-url https://pypi.org/simple \
            --only-binary=:all: \
            "docmethis-fix==${DOCMETHIS_FIX_VERSION}"
          echo "FIX_PYTHON=$venv/bin/python" >> "$GITHUB_ENV"

      - name: Prepare Gateway key
        env:
          FIX_API_KEY: ${{ secrets.DOCMETHIS_FIX_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$FIX_API_KEY"
          key_file="$RUNNER_TEMP/docmethis-fix-api-key"
          umask 077
          printf '%s' "$FIX_API_KEY" > "$key_file"
          echo "DOCMETHIS_FIX_API_KEY_FILE=$key_file" >> "$GITHUB_ENV"

      - name: Generate the Check hand-off
        run: |
          empty_tree="$(git hash-object -t tree /dev/null)"
          set +e
          "$FIX_PYTHON" -m docmethis_check . \
            --git-diff "${empty_tree}..HEAD" \
            --check-mode catchup \
            --no-cache \
            --json-output-file rapport.json \
            --on-nonlinear-push-without-base fail
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi
          test -s rapport.json

      - name: Apply eligible Fix corrections
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          "$FIX_PYTHON" -m docmethis_fix rapport.json --project-root . --pr > fix-result.json
          cat fix-result.json

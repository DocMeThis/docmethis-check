name: DocMeThis Fix

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  fix:
    # Référence officielle figée par SHA complet : toute étape privilégiée vit
    # dans le workflow appelé, approuvé côté Gateway. Une branche ou un tag
    # mutable ne satisfait pas ce contrat.
    uses: DocMeThis/docmethis-fix/.github/workflows/docmethis-fix.yml@bc1efe387883889efaad8fbdb2a6e6168abcabd9
    permissions:
      contents: read
      id-token: write
    secrets:
      DOCMETHIS_FIX_API_KEY: ${{ secrets.DOCMETHIS_FIX_API_KEY }}
      LLM_API_KEY: ${{ secrets.OPENCODE_API_KEY }}

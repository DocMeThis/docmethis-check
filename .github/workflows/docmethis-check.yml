# Copy this workflow into a target repository to add DocMeThis Check.
# It runs Check only: the action reports findings and never applies Fix patches.
name: DocMeThis Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docstrings:
    runs-on: ubuntu-latest
    steps:
      # Keep the project's history so Check can compare the submitted version
      # with the previous version.
      - name: Check out the repository and its history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      # Cache extraction records across runs; the extractor validates file hashes and its own fingerprint.
      - name: Restore DocMeThis extraction cache
        id: docmethis-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .docmethis_cache.json
          key: docmethis-extract-v5-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}-${{ github.sha }}
          restore-keys: |
            docmethis-extract-v5-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}-

      # Security note: @main follows the latest code on the DocMeThis Check
      # main branch. This repository uses it to test the action itself. When
      # copying this workflow, replace @main with the full commit SHA associated
      # with the release tag you choose.
      - name: Check documentation consistency
        uses: DocMeThis/docmethis-check@main
        env:
          GITHUB_BEFORE_SHA: ${{ github.event.before }}

      - name: Save DocMeThis extraction cache
        if: >-
          always() && steps.docmethis-cache.outputs.cache-hit != 'true' &&
          hashFiles('.docmethis_cache.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .docmethis_cache.json
          key: ${{ steps.docmethis-cache.outputs.cache-primary-key }}
